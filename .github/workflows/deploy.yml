name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight run finish rather than cancelling it, but only keep one
# queued behind it. Cancelling mid-deploy can leave Pages serving a partial
# upload, which is worse than waiting a few extra seconds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A user site (repo named <user>.github.io) is served from the DOMAIN
        # ROOT, so base must be "/" — not "/<repo>/".
        #
        # This resolves itself either way: the repo name IS "<user>.github.io",
        # so the default branch of the expression below yields "/" for a user
        # site and "/<repo>/" for a project site. Deriving it rather than
        # hardcoding it means the same workflow works in both places.
        #
        # Guard the empty case explicitly: if someone later renames the repo,
        # GITHUB_REPOSITORY is still set, so this cannot silently become "//".
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${GITHUB_REPOSITORY%%/*}.github.io" ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/${REPO}/"
          fi
          echo "Deploying with BASE_PATH=${BASE_PATH} (repo: ${REPO})"
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
